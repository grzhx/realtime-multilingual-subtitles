[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-multilingual-subtitles"
version = "0.2.0"
description = "Windows real-time multilingual system-audio subtitles with local translation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "grzhx" }]
keywords = ["subtitles", "speech-to-text", "translation", "whisper", "qwen", "wasapi"]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
