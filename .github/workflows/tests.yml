name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_config.py -v
      - run: python -m unittest discover -s tests -p test_stream_latency.py -v
      - run: python -m unittest discover -s tests -p test_audio_devices.py -v
      - run: python -m unittest discover -s tests -p test_gguf.py -v
      - run: python -m compileall -q src tests
